services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storyverse
      POSTGRES_USER: storyverse_migrator
      POSTGRES_PASSWORD: local-migrator-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - storyverse_pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-storyverse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyverse_migrator -d storyverse"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  storyverse_pg:
